<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Pro | Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { 
            --primary: #6366f1; 
            --accent: #a5b4fc;
            --bg: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            background-color: var(--bg);
            overflow: hidden;
        }

        /* Left Side: Animated Section */
        .left-side {
            flex: 1.2;
            background: linear-gradient(135deg, #7367f0 0%, #302b63 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            border-radius: 0 60px 60px 0;
            position: relative;
            z-index: 2;
            box-shadow: 15px 0 40px rgba(0,0,0,0.1);
        }

        /* Animated Floating Circle */
        .circle {
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: 15%;
            left: 10%;
            animation: float 8s infinite ease-in-out;
        }

        .left-content {
            z-index: 3;
            text-align: center;
        }

        /* Right Side: Form Section */
        .right-side {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: var(--bg);
        }

        .form-card {
            width: 100%;
            max-width: 420px;
        }

        h2 { font-weight: 800; font-size: 2.2rem; color: #1e293b; margin-bottom: 8px; }
        p.subtitle { color: #64748b; margin-bottom: 30px; font-size: 0.95rem; }

        .input-group { margin-bottom: 18px; }
        
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .reg-btn {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
            transition: 0.3s;
        }

        .reg-btn:hover {
            background: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(99, 102, 241, 0.3);
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        /* Error Text */
        #error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="left-side animate__animated animate__fadeInLeft">
        <div class="circle"></div>
        <div class="left-content">
            <h1 style="font-size: 3.5rem; font-weight: 800; letter-spacing: -2px;">Join Now</h1>
            <p style="font-weight: 300; font-size: 1.1rem; opacity: 0.9;">Start managing your inventory efficiently today.</p>
        </div>
    </div>

    <div class="right-side">
        <div class="form-card animate__animated animate__fadeInRight">
            <h2>Create Account</h2>
            <p class="subtitle">Enter your details to get started</p>
            
            <div id="error-msg">Passwords do not match!</div>

            <div class="input-group"><input type="text" id="reg-name" placeholder="Full Name" required></div>
            <div class="input-group"><input type="email" id="reg-email" placeholder="Email Address" required></div>
            <div class="input-group"><input type="password" id="reg-pass" placeholder="Password" required></div>
            <div class="input-group"><input type="password" id="reg-confirm" placeholder="Confirm Password" required></div>
            <div class="input-group"><input type="text" id="reg-id" placeholder="Employee ID (Authorized)" required></div>

            <button class="reg-btn" onclick="handleRegister()">Register Account</button>
            
            <div class="footer-text">
                Already have an account? <a href="index.html">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        async function handleRegister() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-pass').value;
            const confirm = document.getElementById('reg-confirm').value;
            const empId = document.getElementById('reg-id').value;
            const errorDiv = document.getElementById('error-msg');

            if (password !== confirm) {
                errorDiv.innerText = "Passwords do not match!";
                errorDiv.style.display = "block";
                return;
            }

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, empId })
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = "index.html"; // Instant redirect
                } else {
                    errorDiv.innerText = result.message || "Registration failed.";
                    errorDiv.style.display = "block";
                }
            } catch (err) {
                console.error("Connection error");
            }
        }
    </script>
</body>
</html>
